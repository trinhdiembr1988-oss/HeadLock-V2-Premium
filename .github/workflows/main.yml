name: Build HeadLock V2 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          echo "===== ROOT ====="
          ls -la

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "LOI: Khong tim thay file ZIP"
            exit 1
          fi

          echo "ZIP = $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "LOI: Khong tim thay Android project"
            exit 1
          fi

          echo "PROJECT = $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. .

          echo "===== PROJECT ROOT ====="
          ls -la

      - name: Check Android project
        shell: bash
        run: |
          set -e

          if [ ! -d "app" ]; then
            echo "LOI: Khong co thu muc app"
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "LOI: Khong co settings.gradle"
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "LOI: Khong co app/build.gradle"
            exit 1
          fi

          echo "Android project OK"

      - name: Enable AndroidX
        shell: bash
        run: |
          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Fix AppCompat dependency
        shell: bash
        run: |
          set -e

          if [ -f "app/build.gradle" ]; then

            echo "===== app/build.gradle BEFORE ====="
            cat app/build.gradle

            if ! grep -q "androidx.appcompat:appcompat" app/build.gradle; then
              python3 - <<'PY'
from pathlib import Path

p = Path("app/build.gradle")
s = p.read_text()

dep = '    implementation "androidx.appcompat:appcompat:1.7.0"\n'

if "dependencies {" in s:
    s = s.replace(
        "dependencies {",
        "dependencies {\n" + dep,
        1
    )
else:
    s += "\n\ndependencies {\n" + dep + "}\n"

p.write_text(s)
PY
            fi

            echo "===== app/build.gradle AFTER ====="
            cat app/build.gradle

          elif [ -f "app/build.gradle.kts" ]; then

            echo "===== app/build.gradle.kts BEFORE ====="
            cat app/build.gradle.kts

            if ! grep -q "androidx.appcompat:appcompat" app/build.gradle.kts; then
              python3 - <<'PY'
from pathlib import Path

p = Path("app/build.gradle.kts")
s = p.read_text()

dep = '    implementation("androidx.appcompat:appcompat:1.7.0")\n'

if "dependencies {" in s:
    s = s.replace(
        "dependencies {",
        "dependencies {\n" + dep,
        1
    )
else:
    s += '\n\ndependencies {\n' + dep + '}\n'

p.write_text(s)
PY
            fi

            echo "===== app/build.gradle.kts AFTER ====="
            cat app/build.gradle.kts

          fi

      - name: Check AppCompat theme
        shell: bash
        run: |
          echo "===== SEARCH THEME ====="
          grep -R "Theme.AppCompat" -n app/src/main 2>/dev/null || true

          echo "===== SEARCH APPCOMPAT ====="
          grep -R "androidx.appcompat" -n app 2>/dev/null || true

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "===== GRADLE BUILD ====="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-V2-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
