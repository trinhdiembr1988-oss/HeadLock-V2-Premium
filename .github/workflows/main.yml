name: Build HeadLock V2 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Không tìm thấy file ZIP dự án."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "=== Files ==="
          find extracted -maxdepth 4 -type f | head -100

          PROJECT_DIR=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Không tìm thấy settings.gradle."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          cp -r "$PROJECT_DIR"/. ./ 

      - name: Check project
        shell: bash
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== APP ==="
          ls -la app || true

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Thiếu settings.gradle."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        shell: bash
        run: |
          gradle assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-V2-Premium-APK
          path: |
            **/build/outputs/apk/debug/*.apk
