name: Build HeadLock V2 Premium

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "LOI: Khong tim thay ZIP"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "LOI: Khong tim thay Android project"
            exit 1
          fi

          cp -R "$PROJECT_DIR"/. .

          echo "===== PROJECT ====="
          ls -la
          ls -la app

      - name: Configure Android repositories
        shell: bash
        run: |
          set -e

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HeadLock-V2-Premium"
          include(":app")
          EOF

      - name: Configure Android project
        shell: bash
        run: |
          set -e

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.headlock.v2'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.headlock.v2'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '2.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Remove AppCompat theme dependency
        shell: bash
        run: |
          set -e

          if [ -d "app/src/main/res/values" ]; then

            if [ -f "app/src/main/res/values/themes.xml" ]; then
              sed -i \
                's/Theme\.AppCompat\.NoActionBar/Theme.Material3.DayNight.NoActionBar/g' \
                app/src/main/res/values/themes.xml
            fi

            if [ -f "app/src/main/res/values/styles.xml" ]; then
              sed -i \
                's/Theme\.AppCompat\.NoActionBar/Theme.Material3.DayNight.NoActionBar/g' \
                app/src/main/res/values/styles.xml
            fi

          fi

          echo "===== THEME CHECK ====="
          grep -R "Theme.AppCompat.NoActionBar" -n app/src/main || true

      - name: Check project
        shell: bash
        run: |
          set -e

          test -d app
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "PROJECT OK"

      - name: Build APK
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --refresh-dependencies

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK ====="
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HeadLock-V2-Premium-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
